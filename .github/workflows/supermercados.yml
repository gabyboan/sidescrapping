name: Actualizar muestras de supermercados

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-sidecompras
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar muestras publicas
        run: python exportar_supermercados.py
      - name: Guardar muestras
        run: |
          if [ -n "$(git status --porcelain -- supermercados.json comparaciones.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add supermercados.json comparaciones.json
            git commit -m 'Actualizar muestras de supermercados'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
