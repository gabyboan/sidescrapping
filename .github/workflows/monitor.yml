name: Avisos de Sidecompras

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      prueba_aviso:
        description: Crear una incidencia de prueba
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-sidecompras
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crear aviso de prueba
        if: ${{ inputs.prueba_aviso == true }}
        run: python monitor.py --prueba
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Revisar el catálogo
        if: ${{ inputs.prueba_aviso != true }}
        run: python monitor.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar estado y listado de precios
        if: ${{ inputs.prueba_aviso != true }}
        run: |
          if [ -n "$(git status --porcelain -- estado.json precios.json ofertas_estado.json OFERTAS.md catalogo.json comparaciones_side.json mercado.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add estado.json precios.json ofertas_estado.json OFERTAS.md catalogo.json comparaciones_side.json mercado.json
            git commit -m 'Actualizar seguimiento de Sidecompras'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
